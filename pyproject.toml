[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "CMOCP"
version = "0.1.0"
description = "CMOCP implementation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.11", "torch>=2.2", "scikit-learn>=1.3", "matplotlib>=3.8"]

[project.scripts]
cmocp = "cmocp.cli:main"

[tool.setuptools.packages.find]
include = ["cmocp*"]
